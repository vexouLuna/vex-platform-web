name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventions:
    uses: vexouLuna/conventions/.github/workflows/conventions-check.yml@v4.3.0
    secrets:
      CONVENTIONS_PRIVATE_PATTERNS: ${{ secrets.CONVENTIONS_PRIVATE_PATTERNS }}

  ci:
    # Installs with --ignore-scripts, so `prepare` (the build) runs only as its own step; `pack` checks
    # what a git install of a tag would get.
    uses: vexouLuna/conventions/.github/workflows/node-ci.yml@v4.3.0
    with:
      pack: true

  review:
    # After the checks: no review, and no usage spent, on a change that fails them.
    needs: [conventions, ci]
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: vexouLuna/conventions/.github/workflows/claude-review.yml@v4.3.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
