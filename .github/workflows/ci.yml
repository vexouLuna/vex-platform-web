name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventions:
    uses: vexouLuna/conventions/.github/workflows/conventions-check.yml@v3.0.0
    secrets:
      CONVENTIONS_PRIVATE_PATTERNS: ${{ secrets.CONVENTIONS_PRIVATE_PATTERNS }}

  ci:
    # Installs with --ignore-scripts, so `prepare` (the build) runs only as its own step; `pack` checks
    # what a git install of a tag would get.
    uses: vexouLuna/conventions/.github/workflows/node-ci.yml@v3.0.0
    with:
      pack: true
